<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Registration Requests')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <h4 class="mb-2">Registration Requests</h4>
    <p class="text-muted mb-4">Review and approve or deny new account requests.</p>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Account Type</th>
                                <th>Requested</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="request : ${pendingRequests}">
                                <td th:text="${request.getFirstName() + ' ' + request.getLastName()}">John Doe</td>
                                <td th:text="${request.getUsername()}">johndoe</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${request.getAccountType().name() == 'MANAGER' ? 'bg-primary' :
                                                           (request.getAccountType().name() == 'DEVELOPER' ? 'bg-dark' :
                                                           (request.getAccountType().name() == 'ADMIN' ? 'bg-danger' : 'bg-secondary'))}"
                                          th:text="${request.getAccountType().name()}">TECHNICIAN</span>
                                </td>
                                <td th:text="${#temporals.format(request.getCreatedAt(), 'MMM d, yyyy h:mm a')}">Jan 1, 2026 12:00 PM</td>
                                <td class="text-end">
                                    <form th:action="@{/developer/registration-requests/{id}/approve(id=${request.getId()})}"
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-success">
                                            <i class="bi bi-check-lg me-1"></i>Approve
                                        </button>
                                    </form>
                                    <form th:action="@{/developer/registration-requests/{id}/deny(id=${request.getId()})}"
                                          method="post" class="d-inline ms-1">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="bi bi-x-lg me-1"></i>Deny
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${#lists.isEmpty(pendingRequests)}" class="card-body text-muted text-center py-4">
                    No pending registration requests.
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
