<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Registration Requests')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4>Registration Requests</h4>
            <div class="sub">Choose a role to approve a new account, or deny the request.</div>
        </div>
        <span class="pill" th:classappend="${!pendingRequests.isEmpty()} ? 'warn'" th:text="${pendingRequests.size() + ' pending'}">0 pending</span>
    </div>

    <div class="s2s-panel">
        <div th:if="${#lists.isEmpty(pendingRequests)}" class="s2s-empty">
            <i class="bi bi-person-check d-block fs-3 mb-1"></i>No pending registration requests.
        </div>
        <div th:each="request : ${pendingRequests}" class="s2s-row flex-wrap request-row">
            <span class="avatar" th:text="${(request.getFirstName().substring(0,1) + request.getLastName().substring(0,1)).toUpperCase()}">JD</span>
            <span class="grow">
                <span class="title d-block" th:text="${request.getFirstName() + ' ' + request.getLastName()}">John Doe</span>
                <span class="meta d-block" th:text="${request.getEmail() + ' · requested ' + @fmt.ago(request.getCreatedAt())}">john@example.com</span>
            </span>
            <div class="request-actions">
                <form th:action="@{/developer/registration-requests/{id}/approve(id=${request.getId()})}" method="post" class="d-flex gap-2 m-0">
                    <select name="accountType" class="form-select form-select-sm" required aria-label="Role">
                        <option value="" disabled selected>Choose role</option>
                        <option value="TECHNICIAN">Technician</option>
                        <option value="MANAGER">Manager</option>
                        <option value="DEVELOPER">Developer</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-s2s text-nowrap"><i class="bi bi-check-lg me-1"></i>Approve</button>
                </form>
                <form th:action="@{/developer/registration-requests/{id}/deny(id=${request.getId()})}" method="post" class="m-0"
                      onsubmit="return confirm('Deny this registration request?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-x-lg me-1"></i>Deny</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
