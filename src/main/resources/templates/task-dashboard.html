<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Tasks')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Task Dashboard</h4>
        <a th:href="@{/tasks/create}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i> Create Task
        </a>
    </div>

    <div class="row g-4">
        <!-- Active Tasks -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-play-circle me-2"></i>Active Tasks
                        <span th:if="${!#lists.isEmpty(activeTasks)}"
                              class="badge bg-info ms-2"
                              th:text="${#lists.size(activeTasks)}"></span>
                    </h5>
                </div>
                <div class="list-group list-group-flush">
                    <!-- Technician view: own active runs as resume links -->
                    <a th:if="${!isManager}"
                       th:each="run : ${activeTasks}"
                       th:href="@{/tasks/{taskId}/resume/{runId}(taskId=${run.getTask().getId()}, runId=${run.getId()})}"
                       class="list-group-item list-group-item-action task-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <span th:text="${run.getTask().getTitle()}">Task Name</span>
                            <small class="text-muted"
                                   th:text="${#temporals.format(run.getStartTime(), 'MMM d, h:mm a')}"></small>
                        </div>
                    </a>

                    <!-- Manager/developer view: all active runs with technician + status.
                         The manager's OWN runs are clickable (so they can resume after a pause);
                         everyone else's are info-only. -->
                    <th:block th:if="${isManager}" th:each="run : ${activeTasks}">
                        <!-- Own run — clickable resume link -->
                        <a th:if="${run.getCompletedBy().getId() == session.loggedInUser.getId()}"
                           th:href="@{/tasks/{taskId}/resume/{runId}(taskId=${run.getTask().getId()}, runId=${run.getId()})}"
                           class="list-group-item list-group-item-action task-item">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="fw-semibold" th:text="${run.getTask().getTitle()}">Task Name</div>
                                    <small class="text-muted">
                                        <i class="bi bi-person-check me-1"></i>You
                                    </small>
                                </div>
                                <div class="text-end">
                                    <span th:if="${pausedRunIds.contains(run.getId())}"
                                          class="badge bg-warning text-dark mb-1">
                                        <i class="bi bi-pause-fill me-1"></i>Paused
                                    </span>
                                    <span th:unless="${pausedRunIds.contains(run.getId())}"
                                          class="badge bg-success mb-1">
                                        <i class="bi bi-play-fill me-1"></i>Active
                                    </span>
                                    <div>
                                        <small class="text-muted"
                                               th:text="${#temporals.format(run.getStartTime(), 'MMM d, h:mm a')}"></small>
                                    </div>
                                </div>
                            </div>
                        </a>

                        <!-- Someone else's run — clickable to view progress + pause reason -->
                        <a th:unless="${run.getCompletedBy().getId() == session.loggedInUser.getId()}"
                           th:href="@{/checklist-runs/runs/{id}(id=${run.getId()})}"
                           class="list-group-item list-group-item-action task-item">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="fw-semibold" th:text="${run.getTask().getTitle()}">Task Name</div>
                                    <small class="text-muted">
                                        <i class="bi bi-person me-1"></i>
                                        <span th:text="${run.getCompletedBy().getFirstName() + ' ' + run.getCompletedBy().getLastName()}">Tech Name</span>
                                    </small>
                                </div>
                                <div class="text-end">
                                    <span th:if="${pausedRunIds.contains(run.getId())}"
                                          class="badge bg-warning text-dark mb-1">
                                        <i class="bi bi-pause-fill me-1"></i>Paused
                                    </span>
                                    <span th:unless="${pausedRunIds.contains(run.getId())}"
                                          class="badge bg-success mb-1">
                                        <i class="bi bi-play-fill me-1"></i>Active
                                    </span>
                                    <div>
                                        <small class="text-muted"
                                               th:text="${#temporals.format(run.getStartTime(), 'MMM d, h:mm a')}"></small>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </th:block>

                    <div th:if="${#lists.isEmpty(activeTasks)}" class="list-group-item text-muted">
                        No active tasks.
                    </div>
                </div>
            </div>
        </div>

        <!-- Available Tasks -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-list-task me-2"></i>Available Tasks
                    </h5>
                </div>
                <div class="list-group list-group-flush">
                    <a th:each="task : ${availableTasks}"
                       th:href="@{/tasks/{id}(id=${task.getId()})}"
                       class="list-group-item list-group-item-action task-item">
                        <span th:text="${task.getTitle()}">Task Name</span>
                    </a>
                    <div th:if="${#lists.isEmpty(availableTasks)}" class="list-group-item text-muted">
                        No tasks available.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pending Approval (Manager only) -->
    <div th:if="${isManager}" class="row g-4 mt-2">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-clock-history me-2"></i>Pending Approval
                        <span th:if="${pendingRuns != null and !#lists.isEmpty(pendingRuns)}"
                              class="badge bg-warning text-dark ms-2"
                              th:text="${#lists.size(pendingRuns)}"></span>
                    </h5>
                </div>
                <div class="list-group list-group-flush">
                    <a th:each="run : ${pendingRuns}"
                       th:href="@{/checklist-runs/runs/{id}(id=${run.getId()})}"
                       class="list-group-item list-group-item-action task-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span th:text="${run.getTask().getTitle()}">Task Name</span>
                                <small class="text-muted ms-2"
                                       th:text="'by ' + ${run.getCompletedBy().getFirstName() + ' ' + run.getCompletedBy().getLastName()}"></small>
                            </div>
                            <small class="text-muted"
                                   th:if="${run.getEndTime() != null}"
                                   th:text="${#temporals.format(run.getEndTime(), 'MMM d, h:mm a')}"></small>
                        </div>
                    </a>
                    <div th:if="${pendingRuns == null or #lists.isEmpty(pendingRuns)}" class="list-group-item text-muted">
                        No pending checklists.
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
