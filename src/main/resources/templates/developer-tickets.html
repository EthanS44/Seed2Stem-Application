<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Tickets')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4>Tickets</h4>
            <div class="sub" th:text="${showResolved}
                 ? 'Resolved tickets. Reopen one if it needs more work.'
                 : 'Bug reports and suggestions from users. Resolve a ticket once it is handled or dismissed.'">Bug reports and suggestions.</div>
        </div>
    </div>

    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${!showResolved} ? 'active'" th:href="@{/developer/tickets}">
                Open <span class="pill ms-1" th:classappend="${openCount > 0} ? 'warn'" th:text="${openCount}">0</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${showResolved} ? 'active'" th:href="@{/developer/tickets(showResolved=true)}">
                Resolved <span class="pill ms-1" th:text="${resolvedCount}">0</span>
            </a>
        </li>
    </ul>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <div class="col-12">
            <div th:if="${#lists.isEmpty(tickets)}" class="card">
                <div class="card-body text-muted text-center py-5">
                    <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                    <div class="mt-2">
                        <span th:if="${showResolved}">No resolved tickets yet.</span>
                        <span th:unless="${showResolved}">No open tickets. All caught up.</span>
                    </div>
                </div>
            </div>

            <div th:each="ticket : ${tickets}" class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
                        <div class="flex-grow-1">
                            <h6 class="mb-1" th:text="${ticket.getTitle()}">Ticket title</h6>
                            <small class="text-muted">
                                <i class="bi bi-person me-1"></i>
                                <span th:if="${ticket.getSubmittedBy() != null}"
                                      th:text="${ticket.getSubmittedBy().getName()}">Name</span>
                                &middot;
                                <span th:text="${@fmt.when(ticket.getSubmittedAt())}">Date</span>
                                <span th:if="${ticket.getResolvedAt() != null}">
                                    &nbsp;&bull;&nbsp;
                                    <i class="bi bi-check2 me-1"></i>Resolved
                                    <span th:text="${#temporals.format(ticket.getResolvedAt(), 'MMM d, yyyy h:mm a')}">Resolved date</span>
                                </span>
                            </small>
                        </div>
                        <div class="text-end">
                            <span th:if="${ticket.getStatus().name() == 'OPEN'}"
                                  class="badge bg-warning text-dark">Open</span>
                            <span th:if="${ticket.getStatus().name() == 'RESOLVED'}"
                                  class="badge bg-success">Resolved</span>
                        </div>
                    </div>
                    <p class="mb-3" style="white-space: pre-wrap;" th:text="${ticket.getDescription()}">Description</p>
                    <div class="d-flex gap-2">
                        <form th:if="${ticket.getStatus().name() == 'OPEN'}"
                              th:action="@{/developer/tickets/{id}/resolve(id=${ticket.getId()})}"
                              method="post">
                            <button type="submit" class="btn btn-sm btn-success">
                                <i class="bi bi-check2 me-1"></i> Mark Resolved
                            </button>
                        </form>
                        <form th:if="${ticket.getStatus().name() == 'RESOLVED'}"
                              th:action="@{/developer/tickets/{id}/reopen(id=${ticket.getId()})}"
                              method="post">
                            <button type="submit" class="btn btn-sm btn-outline-warning">
                                <i class="bi bi-arrow-counterclockwise me-1"></i> Reopen
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
