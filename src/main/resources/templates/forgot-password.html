<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Forgot Password')}"></head>
<body class="auth-wrapper">

<div class="auth-card">
    <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
            <img th:src="@{/Seed2Stem_Logo.png}" alt="Seed2Stem" class="img-fluid mb-3">
            <h4 class="mb-3">Forgot Password</h4>

            <p class="text-muted small mb-3">
                Enter your username and name to request a password reset.
                A developer will review your request and set a new password.
            </p>

            <div th:if="${param.error}" class="alert alert-danger py-2" th:text="${param.error}"></div>

            <form th:action="@{/auth/forgot-password}" method="POST">
                <div class="mb-2">
                    <input type="text" class="form-control" name="username" placeholder="Username" required>
                </div>
                <div class="mb-2">
                    <input type="text" class="form-control" name="firstName" placeholder="First Name" required>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" name="lastName" placeholder="Last Name" required>
                </div>
                <button type="submit" class="btn btn-s2s w-100">Submit Request</button>
            </form>

            <a th:href="@{/auth/login}" class="d-block mt-3 text-decoration-none">Back to login</a>
            <div class="text-muted small mt-3">&copy; Seed2Stem</div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
