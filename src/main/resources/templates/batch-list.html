<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Batches')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Batches</h4>
        <a th:href="@{/batches/create}" class="btn btn-s2s">
            <i class="bi bi-plus-lg me-1"></i> New Batch
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Batch Code</th>
                        <th>Strain</th>
                        <th>Room</th>
                        <th>Plants</th>
                        <th>Status</th>
                        <th>Start Date</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="batch : ${batches}">
                        <td>
                            <a th:href="@{/batches/{id}(id=${batch.getId()})}"
                               class="text-decoration-none fw-semibold"
                               th:text="${batch.getBatchCode()}"></a>
                        </td>
                        <td th:text="${batch.getStrain()}"></td>
                        <td th:text="${batch.getRoom()}"></td>
                        <td th:text="${batch.getPlantCount()}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="'badge-' + ${batch.getStatus().name().toLowerCase()}"
                                  th:text="${batch.getStatus().getDisplayName()}"></span>
                        </td>
                        <td th:text="${#temporals.format(batch.getStartDate(), 'MMM d, yyyy')}"></td>
                        <td>
                            <a th:href="@{/batches/{id}(id=${batch.getId()})}"
                               class="btn btn-sm btn-outline-secondary">View</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(batches)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No batches yet. Create your first batch to get started.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
