<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Register')}"></head>
<body class="auth-wrapper">

<div class="auth-card">
    <div class="card">
        <div class="card-body p-4 text-center">
            <img th:src="@{/Seed2Stem_Logo.png}" alt="Seed2Stem" class="img-fluid mb-3">
            <h4 class="mb-1">Create an account</h4>
            <p class="text-muted small mb-3">A developer approves new accounts before you can sign in.</p>

            <div th:if="${param.error}" class="alert alert-danger py-2" th:text="${param.error}"></div>

            <form th:action="@{/auth/register}" method="post">
                <div class="row g-2 mb-2">
                    <div class="col-6"><input type="text" class="form-control" name="firstName" placeholder="First Name" required autocomplete="given-name"></div>
                    <div class="col-6"><input type="text" class="form-control" name="lastName" placeholder="Last Name" required autocomplete="family-name"></div>
                </div>
                <div class="mb-2">
                    <input type="email" class="form-control" name="email" placeholder="Email" required autocomplete="email">
                </div>
                <div class="mb-2">
                    <input type="password" class="form-control" name="password" placeholder="Password" required>
                </div>
                <div class="mb-2">
                    <input type="password" class="form-control" name="confirmPassword" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn btn-s2s w-100 mt-1">Request account</button>
            </form>

            <a th:href="@{/auth/login}" class="d-block mt-3 text-decoration-none">Back to login</a>
            <div class="text-muted small mt-3">&copy; Seed2Stem</div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
