<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - User Created Tasks')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4 th:text="${showArchived} ? 'Archived User Created Tasks' : 'User Created Tasks'">User Created Tasks</h4>
            <div class="sub" th:text="${showArchived}
                 ? 'Archived tasks keep their history. Restore one to make it visible again.'
                 : 'Work technicians logged outside the standard tasks. Good candidates for new standard tasks.'">Work technicians logged.</div>
        </div>
        <a th:if="${!showArchived}" th:href="@{/developer/user-created-tasks(showArchived=true)}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-archive me-1"></i>Archived
        </a>
        <a th:if="${showArchived}" th:href="@{/developer/user-created-tasks}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Active tasks
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="s2s-panel">
        <div th:if="${#lists.isEmpty(userCreatedTasks)}" class="s2s-empty">
            <span th:if="${showArchived}">No archived user-created tasks.</span>
            <span th:unless="${showArchived}">No user-created tasks yet.</span>
        </div>
        <div th:each="task : ${userCreatedTasks}" class="s2s-row align-items-start">
            <a th:href="${taskRunMap.containsKey(task.getId())} ? @{/checklist-runs/runs/{id}(id=${taskRunMap.get(task.getId())})} : @{/tasks/{id}(id=${task.getId()})}"
               class="grow text-decoration-none text-reset">
                <span class="title d-block" th:text="${task.getTitle()}">Task Name</span>
                <span class="meta d-block" style="white-space:normal"
                      th:if="${task.getDescription() != null and !task.getDescription().isBlank()}"
                      th:text="${task.getDescription()}">Description</span>
                <span class="meta d-block" th:if="${task.getCreatedBy() != null}"
                      th:text="${'Created by ' + task.getCreatedBy().getName()}">Created by</span>
            </a>
            <form th:unless="${showArchived}" th:action="@{/developer/tasks/{id}/archive(id=${task.getId()})}" method="post" class="m-0"
                  onsubmit="return confirm('Archive this task? It will be hidden from the task list. In-progress runs and historical data are kept, and you can restore it later.');">
                <input type="hidden" name="redirect" value="user-created-tasks">
                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-archive me-1"></i>Archive</button>
            </form>
            <form th:if="${showArchived}" th:action="@{/developer/tasks/{id}/restore(id=${task.getId()})}" method="post" class="m-0">
                <input type="hidden" name="redirect" value="user-created-tasks">
                <button type="submit" class="btn btn-sm btn-outline-success"><i class="bi bi-arrow-counterclockwise me-1"></i>Restore</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
