<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - User Created Tasks')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <h4 class="mb-2">User Created Tasks</h4>
    <p class="text-muted mb-4">Tasks created by technicians in the field. Review these to create standardized tasks with proper checklists.</p>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="list-group list-group-flush">
                    <a th:each="task : ${userCreatedTasks}"
                       th:href="${taskRunMap.containsKey(task.getId())} ? @{/checklist-runs/runs/{id}(id=${taskRunMap.get(task.getId())})} : @{/tasks/{id}(id=${task.getId()})}"
                       class="list-group-item list-group-item-action py-3 text-decoration-none">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="mb-1" th:text="${task.getTitle()}">Task Name</h6>
                                <p class="mb-1 text-muted" th:text="${task.getDescription()}">Description</p>
                                <small class="text-muted"
                                       th:if="${task.getCreatedBy() != null}"
                                       th:text="'Created by ' + ${task.getCreatedBy().getFirstName()} + ' ' + ${task.getCreatedBy().getLastName()}"></small>
                            </div>
                            <span class="badge bg-info">User Created</span>
                        </div>
                    </a>
                    <div th:if="${#lists.isEmpty(userCreatedTasks)}" class="list-group-item text-muted py-4 text-center">
                        No user-created tasks yet.
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
