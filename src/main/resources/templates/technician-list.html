<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Technicians')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <h4 class="mb-4">Technicians</h4>

    <div class="row g-3">
        <div class="col-md-4" th:each="tech : ${technicians}">
            <a th:href="@{/technicians/{id}(id=${tech.id})}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-person-circle"></i></div>
                        <h6 class="card-title mt-2" th:text="${tech.getName()}">Name</h6>
                        <small class="text-muted" th:text="'@' + ${tech.username}">@username</small>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(technicians)}" class="text-muted mt-3">
        No technicians registered yet.
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
