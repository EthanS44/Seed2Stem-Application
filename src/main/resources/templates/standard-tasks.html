<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Standard Tasks')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4 th:text="${showArchived} ? 'Archived Standard Tasks' : 'Standard Tasks'">Standard Tasks</h4>
            <div class="sub" th:text="${showArchived}
                 ? 'Archived tasks keep their history. Restore one to make it selectable again.'
                 : 'Tasks technicians can pick and complete. Click a task to edit it.'">Tasks technicians can pick.</div>
        </div>
        <div class="d-flex gap-2">
            <a th:if="${!showArchived}" th:href="@{/developer/standard-tasks(showArchived=true)}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-archive me-1"></i>Archived
            </a>
            <a th:if="${showArchived}" th:href="@{/developer/standard-tasks}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Active tasks
            </a>
            <a th:href="@{/developer/standard-tasks/new}" class="btn btn-s2s btn-sm" th:unless="${showArchived}">
                <i class="bi bi-plus-circle me-1"></i>New Standard Task
            </a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle table-stack">
                        <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Checklist</th>
                                <th class="text-end">Items</th>
                                <th class="text-end" style="width: 130px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${standardTasks}" class="task-row" style="cursor: pointer;"
                                th:attr="data-href=@{/developer/standard-tasks/{id}/edit(id=${task.getId()})}">
                                <td>
                                    <a th:href="@{/developer/standard-tasks/{id}/edit(id=${task.getId()})}"
                                       class="fw-semibold text-decoration-none" th:text="${task.getTitle()}">Task Title</a>
                                    <span th:if="${task.isBatchTask()}" class="pill ok ms-1"
                                          th:text="${'Batch: ' + task.getBatchAction().getDisplayName()}">Batch</span>
                                </td>
                                <td data-label="Description" th:text="${task.getDescription() != null and !task.getDescription().isBlank() ? task.getDescription() : '—'}" class="text-muted">Description</td>
                                <td data-label="Checklist" th:text="${task.getChecklist() != null ? task.getChecklist().getName() + (task.getChecklist().getVersion() != null and task.getChecklist().getVersion() > 1 ? ' (v' + task.getChecklist().getVersion() + ')' : '') : '—'}">Checklist Name</td>
                                <td data-label="Items" class="text-end" th:text="${task.getChecklist() != null ? task.getChecklist().getItems().size() : 0}">0</td>
                                <td class="text-end">
                                    <!-- Active task: show Archive (with confirm) -->
                                    <form th:unless="${showArchived}"
                                          th:action="@{/developer/tasks/{id}/archive(id=${task.getId()})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Archive this task? It will be hidden from the Available Tasks list. In-progress runs and historical data are preserved. You can restore it later.');">
                                        <input type="hidden" name="redirect" value="standard-tasks">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-archive me-1"></i>Archive
                                        </button>
                                    </form>
                                    <!-- Archived task: show Restore -->
                                    <form th:if="${showArchived}"
                                          th:action="@{/developer/tasks/{id}/restore(id=${task.getId()})}"
                                          method="post" class="d-inline">
                                        <input type="hidden" name="redirect" value="standard-tasks">
                                        <button type="submit" class="btn btn-sm btn-outline-success">
                                            <i class="bi bi-arrow-counterclockwise me-1"></i>Restore
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${#lists.isEmpty(standardTasks)}" class="card-body text-muted text-center py-4">
                    <span th:if="${showArchived}">No archived standard tasks.</span>
                    <span th:unless="${showArchived}">No standard tasks yet. Click "New Standard Task" to create one.</span>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    // Clicking a row opens the task's edit page; the Archive/Restore buttons keep their own behaviour.
    document.querySelectorAll('tr.task-row').forEach(function (row) {
        row.addEventListener('click', function (e) {
            if (e.target.closest('form, button, a')) return;
            window.location.href = row.dataset.href;
        });
    });
</script>
</body>
</html>
