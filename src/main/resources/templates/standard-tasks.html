<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Standard Tasks')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 class="mb-0">Standard Tasks</h4>
        <a th:href="@{/developer/standard-tasks/new}" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i> New Standard Task
        </a>
    </div>
    <p class="text-muted mb-4">Predefined tasks with checklists that technicians can select and complete.</p>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Checklist</th>
                                <th class="text-end">Items</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="task : ${standardTasks}">
                                <td th:text="${task.getTitle()}">Task Title</td>
                                <td th:text="${task.getDescription()}" class="text-muted">Description</td>
                                <td th:text="${task.getChecklist() != null ? task.getChecklist().getName() : '—'}">Checklist Name</td>
                                <td class="text-end" th:text="${task.getChecklist() != null ? task.getChecklist().getItems().size() : 0}">0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${#lists.isEmpty(standardTasks)}" class="card-body text-muted text-center py-4">
                    No standard tasks yet. Click "New Standard Task" to create one.
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
