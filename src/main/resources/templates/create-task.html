<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Create Task')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <a th:href="@{/dashboard/task-dashboard}" class="back-link"><i class="bi bi-arrow-left"></i>Tasks</a>
    <div class="page-head">
        <div>
            <h4>Create Task</h4>
            <div class="sub">Log work that isn't one of the standard tasks.</div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-8 col-xl-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <p class="text-muted small mb-4">
                        Once started, you'll describe what you did as you work. Your submission goes to a manager for approval.
                    </p>

                    <form th:action="@{/tasks/create}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">Task Name</label>
                            <input type="text" class="form-control" id="title" name="title"
                                   placeholder="e.g., Cleaned nutrient reservoirs" required>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-bold">Task Description <span class="text-muted fw-normal">(optional)</span></label>
                            <textarea class="form-control" id="description" name="description" rows="3"
                                      placeholder="Brief description of what this task involves..."></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-play-circle me-1"></i> Create and Start Task
                            </button>
                            <a th:href="@{/dashboard/task-dashboard}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
