<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Developer Dashboard')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Developer Dashboard</h4>
        <a th:href="@{/admin/export.xlsx}" class="btn btn-outline-success">
            <i class="bi bi-file-earmark-spreadsheet me-1"></i> Export to Excel
        </a>
    </div>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
            <div class="card text-white bg-warning h-100">
                <div class="card-body">
                    <h6 class="card-title"><i class="bi bi-clock-history me-1"></i> Pending Approvals</h6>
                    <h2 class="mb-0" th:text="${pendingCount != null ? pendingCount : 0}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card text-white bg-info h-100">
                <div class="card-body">
                    <h6 class="card-title"><i class="bi bi-play-circle me-1"></i> All Active Tasks</h6>
                    <h2 class="mb-0" th:text="${allActiveTaskCount != null ? allActiveTaskCount : 0}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card text-white bg-success h-100">
                <div class="card-body">
                    <h6 class="card-title"><i class="bi bi-clock me-1"></i> Clocked In Now</h6>
                    <h2 class="mb-0" th:text="${clockedInCount != null ? clockedInCount : 0}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Access Grid -->
    <h5 class="mb-3">Quick Access</h5>
    <div class="row g-3">
        <div class="col-md-4">
            <a th:href="@{/dashboard/task-dashboard}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-list-task"></i></div>
                        <h6 class="card-title mt-2">Tasks &amp; SOPs</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/batches/create}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-plus-circle"></i></div>
                        <h6 class="card-title mt-2">New Batch</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/developer/user-created-tasks}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-pencil-square"></i></div>
                        <h6 class="card-title mt-2">User Created Tasks</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/developer/registration-requests}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-person-check"></i></div>
                        <h6 class="card-title mt-2">Registration Requests</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/developer/password-reset-requests}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-key"></i></div>
                        <h6 class="card-title mt-2">Password Reset Requests</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/time-clock}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-clock"></i></div>
                        <h6 class="card-title mt-2">Time Clock</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/technicians}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-people"></i></div>
                        <h6 class="card-title mt-2">Technicians</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/settings}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-gear"></i></div>
                        <h6 class="card-title mt-2">Settings</h6>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
