<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Login')}"></head>
<body class="auth-wrapper">

<div class="auth-card">
    <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
            <img th:src="@{/Seed2Stem_Logo.png}" alt="Seed2Stem" class="img-fluid mb-3">
            <h4 class="mb-3">Login</h4>

            <div th:if="${param.error}" class="alert alert-danger py-2" th:text="${param.error}"></div>
            <div th:if="${param.success}" class="alert alert-success py-2" th:text="${param.success}"></div>
            <div th:if="${param.logout}" class="alert alert-info py-2" th:text="${param.logout}"></div>

            <form th:action="@{/auth/login}" method="POST">
                <div class="mb-3">
                    <input type="text" class="form-control" name="username" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-s2s w-100">Sign In</button>
            </form>

            <a th:href="@{/auth/forgot-password}" class="d-block mt-3 text-decoration-none">Forgot password?</a>
            <a th:href="@{/auth/register}" class="d-block mt-2 text-decoration-none">Create an account</a>
            <div class="text-muted small mt-3">&copy; Seed2Stem</div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
