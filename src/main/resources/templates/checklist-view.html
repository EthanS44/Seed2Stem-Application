<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Checklist')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="row">
        <div class="col-lg-9">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="mb-4" th:text="${checklist.getName()}">Checklist Name</h3>

                    <!-- Show validation error if any -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/checklist-runs/submit}" method="post" id="checklistForm">
                        <input type="hidden" name="taskId" th:value="${task.getId()}"/>
                        <input type="hidden" name="runId" th:value="${runId}">
                        <input type="hidden" name="pauseReason" id="pauseReasonHidden">

                        <div th:each="item : ${items}">

                            <!-- HEADER -->
                            <div th:if="${item.getItemType().name() == 'HEADER'}" class="mt-4 mb-3">
                                <h5 class="border-bottom pb-2" th:text="${item.getText()}">Section Header</h5>
                            </div>

                            <!-- QUESTION -->
                            <div th:if="${item.getItemType().name() == 'QUESTION'}" class="mb-4 pb-3 border-bottom">
                                <label class="form-label fw-semibold"
                                       th:text="${item.getQuestionOrder() + '. ' + item.getText()}">
                                    Question text
                                </label>

                                <!-- BOOLEAN + TEXT -->
                                <div th:if="${item.getResponseType().name() == 'BOOLEAN_TEXT'}">
                                    <div class="boolean-buttons mb-2">
                                        <label class="yes-btn">
                                            <input type="radio"
                                                   th:name="'bool_' + ${item.getId()}"
                                                   value="true"
                                                   th:checked="${responses.containsKey(item.getId()) and responses.get(item.getId()).getBooleanAnswer() != null ? responses.get(item.getId()).getBooleanAnswer() : true}">
                                            PASS
                                        </label>
                                        <label class="no-btn">
                                            <input type="radio"
                                                   th:name="'bool_' + ${item.getId()}"
                                                   value="false"
                                                   th:checked="${responses.containsKey(item.getId()) and responses.get(item.getId()).getBooleanAnswer() != null and !responses.get(item.getId()).getBooleanAnswer()}">
                                            FAIL
                                        </label>
                                    </div>
                                    <textarea class="form-control"
                                              rows="2"
                                              th:name="'text_' + ${item.getId()}"
                                              th:text="${responses.containsKey(item.getId()) and responses.get(item.getId()).getTextAnswer() != null ? responses.get(item.getId()).getTextAnswer() : ''}"
                                              placeholder="Additional details (optional)"></textarea>
                                </div>

                                <!-- TEXT -->
                                <div th:if="${item.getResponseType().name() == 'TEXT'}">
                                    <textarea class="form-control"
                                              rows="2"
                                              th:name="'text_' + ${item.getId()}"
                                              th:text="${responses.containsKey(item.getId()) and responses.get(item.getId()).getTextAnswer() != null ? responses.get(item.getId()).getTextAnswer() : ''}"
                                              placeholder="Enter details"></textarea>
                                </div>

                                <!-- INTEGER / NUMBER / DECIMAL -->
                                <div th:if="${item.getResponseType().name() == 'INTEGER' or item.getResponseType().name() == 'NUMBER' or item.getResponseType().name() == 'DECIMAL'}">
                                    <input type="number"
                                           class="form-control"
                                           style="max-width: 300px;"
                                           th:name="'num_' + ${item.getId()}"
                                           th:value="${responses.containsKey(item.getId()) and responses.get(item.getId()).getNumericAnswer() != null ? responses.get(item.getId()).getNumericAnswer() : ''}"
                                           step="any"
                                           placeholder="Enter value">
                                </div>

                                <!-- NONE (checkbox) -->
                                <div th:if="${item.getResponseType().name() == 'NONE'}" class="form-check">
                                    <input type="checkbox" class="form-check-input"
                                           th:id="'check_' + ${item.getId()}"
                                           th:name="'check_' + ${item.getId()}"
                                           value="true"
                                           th:checked="${responses.containsKey(item.getId()) and responses.get(item.getId()).getBooleanAnswer() != null and responses.get(item.getId()).getBooleanAnswer()}">
                                    <label class="form-check-label" th:for="'check_' + ${item.getId()}">
                                        Mark complete
                                    </label>
                                </div>
                            </div>

                        </div>

                        <div class="d-flex gap-3 mt-3">
                            <button type="submit" class="btn btn-s2s btn-lg">
                                <i class="bi bi-check-lg me-1"></i> Submit Checklist
                            </button>
                            <button type="button"
                                    class="btn btn-outline-secondary btn-lg"
                                    data-bs-toggle="modal"
                                    data-bs-target="#pauseModal">
                                <i class="bi bi-pause-fill me-1"></i> Pause
                            </button>
                        </div>
                    </form>

                    <!-- Pause Reason Modal -->
                    <div class="modal fade" id="pauseModal" tabindex="-1" aria-labelledby="pauseModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="pauseModalLabel">
                                        <i class="bi bi-pause-circle me-1"></i> Pause Task
                                    </h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <p class="text-muted small mb-2">
                                        If you'll be gone longer than 5 minutes, please provide a reason for the pause.
                                        This will appear on your shift timeline.
                                    </p>
                                    <label for="pauseReasonInput" class="form-label fw-bold">Reason <span class="text-muted fw-normal">(optional for short breaks)</span></label>
                                    <textarea class="form-control" id="pauseReasonInput" rows="3"
                                              placeholder="e.g., Lunch break, pulled away for another job, bathroom break..."></textarea>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                                    <button type="button" class="btn btn-warning" id="confirmPauseBtn">
                                        <i class="bi bi-pause-circle me-1"></i> Pause Task
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    // When the user confirms the pause, copy the reason into the hidden input,
    // redirect the form to the pause endpoint, disable HTML5 validation
    // (since partial answers are OK on pause), and submit.
    document.getElementById('confirmPauseBtn').addEventListener('click', function() {
        var form = document.getElementById('checklistForm');
        document.getElementById('pauseReasonHidden').value =
            document.getElementById('pauseReasonInput').value;
        form.action = /*[[@{/checklist-runs/pause}]]*/ '/checklist-runs/pause';
        form.noValidate = true;
        form.submit();
    });
</script>
</body>
</html>
