<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Dashboard Alerts: what needs a look right now, most urgent first. Each alert is
     worked out from the current state, so it clears itself once it's dealt with. -->
<div th:fragment="alerts(items)" class="s2s-panel mb-3 alerts-panel" id="alerts">
    <div class="panel-head">
        <h6><i class="bi bi-bell me-2"></i>Alerts</h6>
        <span th:if="${!items.isEmpty()}" class="pill"
              th:classappend="${items[0].level.tone}" th:text="${items.size()}">2</span>
    </div>
    <div th:if="${items.isEmpty()}" class="s2s-empty py-3">
        <i class="bi bi-check2-circle text-success me-1"></i>No alerts. You're all caught up.
    </div>
    <a th:each="n : ${items}" class="s2s-row alert-item" th:classappend="${n.level.tone}" th:href="@{${n.href}}">
        <span class="alert-icon"><i class="bi" th:classappend="${n.icon}"></i></span>
        <span class="grow min-w-0">
            <span class="title d-block" th:text="${n.title}">Something needs a look</span>
            <span th:if="${n.detail != null}" class="meta d-block" th:text="${n.detail}">Details</span>
        </span>
        <span class="alert-action d-none d-sm-inline" th:text="${n.action}">Open</span>
        <i class="bi bi-chevron-right chev"></i>
    </a>
</div>

</body>
</html>
