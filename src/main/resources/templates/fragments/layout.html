<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ===== HEAD FRAGMENT ===== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Seed2Stem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<!-- ===== TOPBAR FRAGMENT ===== -->
<nav th:fragment="topbar" class="navbar navbar-light bg-white fixed-top s2s-topbar px-3">
    <span class="navbar-brand mb-0">Triton Cannabis Group</span>
    <img th:src="@{/Seed2Stem_Logo.png}" alt="Seed2Stem" class="topbar-logo">
</nav>

<!-- ===== SIDEBAR FRAGMENT ===== -->
<nav th:fragment="sidebar" class="s2s-sidebar">
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/dashboard/home-dashboard}">
                <i class="bi bi-house-door me-2"></i> Home
            </a>
        </li>
        <li class="sidebar-heading" th:if="${session.loggedInUser != null}">Technician</li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/dashboard/task-dashboard}">
                <i class="bi bi-list-task me-2"></i> Tasks
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/calendar}">
                <i class="bi bi-calendar3 me-2"></i> Calendar
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/time-clock}">
                <i class="bi bi-clock me-2"></i> Time Clock
            </a>
        </li>
        <li class="sidebar-heading" th:if="${session.loggedInUser != null and session.loggedInUser.getAccountType().name() != 'TECHNICIAN'}">Management</li>
        <li class="nav-item" th:if="${session.loggedInUser != null and session.loggedInUser.getAccountType().name() != 'TECHNICIAN'}">
            <a class="nav-link" th:href="@{/batches}">
                <i class="bi bi-flower1 me-2"></i> Batches
            </a>
        </li>
        <li class="nav-item" th:if="${session.loggedInUser != null and session.loggedInUser.getAccountType().name() != 'TECHNICIAN'}">
            <a class="nav-link" th:href="@{/technicians}">
                <i class="bi bi-people me-2"></i> Technicians
            </a>
        </li>
        <li class="sidebar-heading" th:if="${session.loggedInUser != null and session.loggedInUser.getAccountType().name() == 'DEVELOPER'}">Developer</li>
        <li class="nav-item" th:if="${session.loggedInUser != null and session.loggedInUser.getAccountType().name() == 'DEVELOPER'}">
            <a class="nav-link" th:href="@{/developer/user-created-tasks}">
                <i class="bi bi-pencil-square me-2"></i> User Created Tasks
            </a>
        </li>
        <li class="nav-item" th:if="${session.loggedInUser != null and session.loggedInUser.getAccountType().name() == 'DEVELOPER'}">
            <a class="nav-link" th:href="@{/developer/registration-requests}">
                <i class="bi bi-person-check me-2"></i> Registration Requests
            </a>
        </li>
        <li class="nav-item" th:if="${session.loggedInUser != null and session.loggedInUser.getAccountType().name() == 'DEVELOPER'}">
            <a class="nav-link" th:href="@{/developer/password-reset-requests}">
                <i class="bi bi-key me-2"></i> Password Reset Requests
            </a>
        </li>
        <li class="sidebar-heading">Account</li>
        <li class="nav-item" th:if="${session.loggedInUser != null}">
            <a class="nav-link" th:href="@{/settings}">
                <i class="bi bi-gear me-2"></i> Settings
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:href="@{/auth/logout}">
                <i class="bi bi-box-arrow-left me-2"></i> Logout
            </a>
        </li>
    </ul>
</nav>

<!-- ===== SCRIPTS FRAGMENT ===== -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
