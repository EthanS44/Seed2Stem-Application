<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Dashboard')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <h4 class="mb-4">Technician Dashboard</h4>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-6">
            <div class="card text-white bg-info h-100">
                <div class="card-body">
                    <h6 class="card-title"><i class="bi bi-play-circle me-1"></i> Active Tasks</h6>
                    <h2 class="mb-0" th:text="${activeTaskCount != null ? activeTaskCount : 0}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-6">
            <div class="card text-white h-100" th:classappend="${clockedIn ? 'bg-success' : 'bg-secondary'}">
                <div class="card-body">
                    <h6 class="card-title"><i class="bi bi-clock me-1"></i> Clock Status</h6>
                    <h2 class="mb-0" th:text="${clockedIn ? 'Clocked In' : 'Not Clocked In'}">Status</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Access Grid -->
    <h5 class="mb-3">Quick Access</h5>
    <div class="row g-3">
        <div class="col-md-4">
            <a th:href="@{/dashboard/task-dashboard}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-list-task"></i></div>
                        <h6 class="card-title mt-2">My Tasks</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/time-clock}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-clock"></i></div>
                        <h6 class="card-title mt-2">Time Clock</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/calendar}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-calendar3"></i></div>
                        <h6 class="card-title mt-2">Calendar</h6>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/settings}" class="text-decoration-none">
                <div class="card menu-card shadow-sm h-100">
                    <div class="card-body text-center py-4">
                        <div class="menu-icon"><i class="bi bi-gear"></i></div>
                        <h6 class="card-title mt-2">Settings</h6>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
