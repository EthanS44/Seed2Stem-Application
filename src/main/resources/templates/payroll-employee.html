<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Payroll')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <a th:href="@{'/payroll?' + ${period.query}}" class="back-link"><i class="bi bi-arrow-left"></i>Payroll</a>
    <div class="page-head">
        <div class="d-flex align-items-center gap-3 min-w-0">
            <span class="avatar avatar-lg" th:text="${@fmt.initials(emp.user)}">TT</span>
            <div class="min-w-0">
                <h4 class="text-truncate" th:text="${emp.user.getName()}">Name</h4>
                <div class="sub">
                    <span th:text="${role}">Technician</span> &middot; <span th:text="${emp.user.email}">email</span>
                    <span th:if="${emp.clockedIn}" class="pill ok ms-1"><i class="bi bi-circle-fill" style="font-size:.5rem"></i>On the clock</span>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:replace="~{fragments/payroll-nav :: periodNav(${'/payroll/employees/' + emp.user.id})}"></div>

    <div class="row g-2 g-md-3 mb-3">
        <div class="col-6 col-lg-3">
            <div class="s2s-stat">
                <span class="chip"><i class="bi bi-clock"></i></span>
                <span><span class="num d-block" th:text="${@fmt.hours(emp.totalMinutes)}">0.00</span><span class="lbl">Total hours</span></span>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="s2s-stat info">
                <span class="chip"><i class="bi bi-briefcase"></i></span>
                <span><span class="num d-block" th:text="${@fmt.hours(emp.regularMinutes)}">0.00</span><span class="lbl">Regular</span></span>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="s2s-stat" th:classappend="${emp.overtimeMinutes > 0} ? 'attn'">
                <span class="chip"><i class="bi bi-alarm"></i></span>
                <span><span class="num d-block" th:text="${@fmt.hours(emp.overtimeMinutes)}">0.00</span><span class="lbl">Overtime</span></span>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="s2s-stat" th:classappend="${emp.flaggedCount > 0} ? 'alert'">
                <span class="chip"><i class="bi bi-calendar-check"></i></span>
                <span><span class="num d-block" th:text="${emp.shifts.size()}">0</span>
                    <span class="lbl" th:text="${'Shifts · ' + emp.daysWorked + (emp.daysWorked == 1 ? ' day' : ' days') + (emp.flaggedCount > 0 ? ' · ' + emp.flaggedCount + ' to check' : '')}">Shifts</span></span>
            </div>
        </div>
    </div>

    <!-- Hours per day or week -->
    <div class="s2s-panel mb-3">
        <div class="panel-head"><h6><i class="bi bi-calendar-week me-2"></i>By <span th:text="${period.days <= 16 ? 'day' : 'week'}">day</span></h6></div>
        <div class="pay-chips">
            <div th:each="b, it : ${buckets}" class="pay-chip" th:classappend="${(emp.bucket(it.index) == 0 ? 'zero ' : '') + (b.today ? 'today' : '')}">
                <span class="lbl" th:text="${b.label}">Mon</span>
                <span class="sub" th:text="${b.subLabel}">Oct 26</span>
                <span class="val" th:text="${emp.bucket(it.index) > 0 ? @fmt.hours(emp.bucket(it.index)) : '–'}">7.50</span>
            </div>
        </div>
    </div>

    <!-- Shifts -->
    <div class="s2s-panel">
        <div class="panel-head">
            <h6><i class="bi bi-list-ul me-2"></i>Shifts</h6>
            <span th:unless="${canEdit}" class="small text-muted">You can't edit your own hours</span>
        </div>
        <div th:if="${emp.shifts.isEmpty()}" class="s2s-empty">No shifts in this period.</div>

        <div th:each="s : ${emp.shifts}" class="s2s-row pay-shift flex-wrap" th:classappend="${s.flagged} ? 'flagged'">
            <span class="pay-day">
                <span class="d-block fw-semibold" th:text="${#temporals.format(s.date, 'EEE')}">Mon</span>
                <span class="d-block small text-muted" th:text="${#temporals.format(s.date, 'MMM d')}">Oct 26</span>
            </span>
            <span class="grow">
                <span class="title d-block">
                    <span th:text="${#temporals.format(s.clockIn, 'h:mm a')}">9:00 AM</span> –
                    <span th:text="${s.clockOut != null ? #temporals.format(s.clockOut, 'h:mm a') : (s.active ? 'now' : '?')}">5:00 PM</span>
                </span>
                <span class="meta d-block" th:if="${s.entry.notes != null and !s.entry.notes.isBlank()}" th:text="${s.entry.notes}">Notes</span>
                <span class="d-flex flex-wrap gap-1 mt-1" th:if="${!s.flags.isEmpty() or s.overtimeMinutes > 0}">
                    <span th:each="fl : ${s.flags}" class="pill" th:classappend="${fl.tone}" th:text="${fl.label}">No clock-out</span>
                    <span th:if="${s.overtimeMinutes > 0}" class="pill warn" th:text="${@fmt.hours(s.overtimeMinutes) + ' h overtime'}">1.50 h OT</span>
                </span>
            </span>
            <span class="pay-total" th:text="${@fmt.hours(s.minutes)}">8.00</span>
            <span class="d-flex gap-1">
                <a th:if="${breakdownBase != null}" th:href="@{${breakdownBase + s.entry.id}}" class="btn btn-sm btn-outline-secondary"
                   title="Shift breakdown" aria-label="Shift breakdown"><i class="bi bi-bar-chart-steps"></i></a>
                <button th:if="${canEdit}" type="button" class="btn btn-sm btn-outline-secondary"
                        data-bs-toggle="modal" th:attr="data-bs-target='#edit' + ${s.entry.id}"
                        title="Edit shift" aria-label="Edit shift"><i class="bi bi-pencil"></i></button>
            </span>
        </div>
    </div>

    <!-- Edit modals -->
    <th:block th:if="${canEdit}">
        <div th:each="s : ${emp.shifts}" class="modal fade" th:id="'edit' + ${s.entry.id}" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <form class="modal-content" method="post" th:action="@{/payroll/entries/{id}/edit(id=${s.entry.id})}">
                    <input type="hidden" name="returnQuery" th:value="${period.query}">
                    <div class="modal-header">
                        <h5 class="modal-title" th:text="${'Edit shift · ' + #temporals.format(s.date, 'EEE MMM d')}">Edit shift</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" th:for="'in' + ${s.entry.id}">Clock in</label>
                            <input type="datetime-local" name="clockInTime" class="form-control" th:id="'in' + ${s.entry.id}"
                                   th:value="${#temporals.format(s.clockIn, 'yyyy-MM-dd''T''HH:mm')}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:for="'out' + ${s.entry.id}">Clock out</label>
                            <input type="datetime-local" name="clockOutTime" class="form-control" th:id="'out' + ${s.entry.id}"
                                   th:value="${s.clockOut != null ? #temporals.format(s.clockOut, 'yyyy-MM-dd''T''HH:mm') : ''}">
                        </div>
                        <div>
                            <label class="form-label" th:for="'notes' + ${s.entry.id}">Notes</label>
                            <textarea name="notes" class="form-control" rows="2" th:id="'notes' + ${s.entry.id}" th:text="${s.entry.notes}"
                                      placeholder="Why it changed, e.g. forgot to clock out"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-s2s">Save shift</button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
