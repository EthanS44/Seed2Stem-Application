<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Managers')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4>Managers</h4>
            <div class="sub">Who's on the clock and what they're working on right now.</div>
        </div>
    </div>

    <div class="row g-2 g-md-3 mb-4">
        <div class="col-4">
            <div class="s2s-stat">
                <span class="chip d-none d-sm-grid"><i class="bi bi-person-check"></i></span>
                <span><span class="num d-block" th:text="${clockedInCount}">0</span><span class="lbl">On the clock</span></span>
            </div>
        </div>
        <div class="col-4">
            <div class="s2s-stat info">
                <span class="chip d-none d-sm-grid"><i class="bi bi-play-circle"></i></span>
                <span><span class="num d-block" th:text="${workingCount}">0</span><span class="lbl">Working</span></span>
            </div>
        </div>
        <div class="col-4">
            <div class="s2s-stat" th:classappend="${pausedCount > 0} ? 'attn'">
                <span class="chip d-none d-sm-grid"><i class="bi bi-pause-circle"></i></span>
                <span><span class="num d-block" th:text="${pausedCount}">0</span><span class="lbl">Paused</span></span>
            </div>
        </div>
    </div>

    <div class="s2s-panel">
        <div th:if="${#lists.isEmpty(summaries)}" class="s2s-empty">
            <i class="bi bi-person-badge d-block fs-3 mb-1"></i>No managers registered yet.
        </div>
        <a th:each="s : ${summaries}" class="s2s-row" th:href="@{/managers/{id}(id=${s.manager.id})}">
            <span class="avatar" th:text="${@fmt.initials(s.manager)}">TT</span>
            <span class="grow">
                <span class="title d-block" th:text="${s.manager.getName()}">Name</span>
                <span class="meta d-block" th:if="${s.currentTaskLabel != null}">
                    <i class="bi bi-list-task me-1"></i><span th:text="${s.currentTaskLabel}">Task</span><span
                        th:if="${s.taskStartedAt != null}" th:text="${' · since ' + @fmt.when(s.taskStartedAt)}"></span>
                </span>
                <span class="meta d-block" th:if="${s.currentTaskLabel == null}"
                      th:text="${s.clockedIn ? 'Clocked in ' + @fmt.when(s.clockInTime) + ' · no active task' : s.manager.email}">email</span>
            </span>
            <span th:if="${s.paused}" class="pill warn"><i class="bi bi-pause-fill"></i>Paused</span>
            <span th:if="${!s.paused and s.currentTaskLabel != null}" class="pill info">Working</span>
            <span th:if="${!s.paused and s.currentTaskLabel == null and s.clockedIn}" class="pill ok">Clocked in</span>
            <span th:if="${!s.clockedIn and s.currentTaskLabel == null}" class="pill">Off</span>
            <i class="bi bi-chevron-right chev"></i>
        </a>
    </div>
</main>


<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
