<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Settings')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4>Settings</h4>
            <div class="sub">Your account details and password.</div>
        </div>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2" th:text="${param.error}"></div>
    <div th:if="${param.success}" class="alert alert-success py-2" th:text="${param.success}"></div>

    <div class="row g-3">
        <!-- Account Info -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-person-circle me-2"></i>Account Information
                    </h5>
                </div>
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <span class="avatar" style="width:52px;height:52px;font-size:1.1rem" th:text="${@fmt.initials(user)}">TT</span>
                        <div>
                            <div class="fw-semibold fs-5" th:text="${user.getName()}">Name</div>
                            <span class="pill" th:classappend="${user.getAccountType().name() == 'TECHNICIAN'} ? '' : 'ok'"
                                  th:text="${#strings.capitalize(#strings.toLowerCase(user.getAccountType().name()))}">Technician</span>
                        </div>
                    </div>
                    <dl class="row mb-0 small">
                        <dt class="col-sm-4 text-muted fw-semibold">Email</dt>
                        <dd class="col-sm-8" th:text="${user.getEmail()}">user@example.com</dd>
                        <dt class="col-sm-4 text-muted fw-semibold">First name</dt>
                        <dd class="col-sm-8" th:text="${user.getFirstName()}">First</dd>
                        <dt class="col-sm-4 text-muted fw-semibold">Last name</dt>
                        <dd class="col-sm-8 mb-0" th:text="${user.getLastName()}">Last</dd>
                    </dl>
                </div>
            </div>
        </div>

        <!-- Change Password -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-key me-2"></i>Change Password
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/settings/change-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Current password</label>
                            <input type="password" class="form-control" name="currentPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">New password</label>
                            <input type="password" class="form-control" name="newPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Confirm new password</label>
                            <input type="password" class="form-control" name="confirmPassword" required>
                        </div>
                        <button type="submit" class="btn btn-s2s w-100">
                            <i class="bi bi-check-lg me-1"></i>Update Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
