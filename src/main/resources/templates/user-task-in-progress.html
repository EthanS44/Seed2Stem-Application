<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Task In Progress')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="d-flex align-items-center gap-2 mb-1">
        <span class="badge bg-success"><i class="bi bi-circle-fill me-1" style="font-size: 0.6rem;"></i>In Progress</span>
        <small class="text-muted">Started <span th:text="${#temporals.format(run.getStartTime(), 'h:mm a')}">12:00 PM</span></small>
    </div>
    <h4 class="mb-4" th:text="${task.getTitle()}">Task Name</h4>

    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <p class="text-muted mb-3">
                        Describe what you're doing as you work. You can save your progress and come back,
                        or submit when finished. Your submission will be sent for manager approval.
                    </p>

                    <form th:action="@{/tasks/runs/{runId}/submit-user-task(runId=${run.getId()})}" method="post" id="submitForm">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Work Log</label>
                            <textarea class="form-control" name="workLog" rows="10"
                                      placeholder="Describe the work you completed, where, and any notes for the manager..."
                                      th:text="${savedWorkLog}"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle me-1"></i> Submit for Approval
                            </button>
                            <button type="submit"
                                    form="saveForm"
                                    class="btn btn-outline-secondary">
                                <i class="bi bi-floppy me-1"></i> Save Progress
                            </button>
                        </div>
                    </form>

                    <form th:action="@{/tasks/runs/{runId}/save-progress(runId=${run.getId()})}" method="post" id="saveForm">
                        <input type="hidden" name="workLog" id="saveWorkLog">
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h6 class="mb-0"><i class="bi bi-info-circle me-2"></i>Task Details</h6>
                </div>
                <div class="card-body">
                    <dl class="row mb-0 small">
                        <dt class="col-5">Task</dt>
                        <dd class="col-7" th:text="${task.getTitle()}">Name</dd>
                        <dt class="col-5" th:if="${task.getDescription() != null and !task.getDescription().isBlank()}">Description</dt>
                        <dd class="col-7" th:if="${task.getDescription() != null and !task.getDescription().isBlank()}"
                            th:text="${task.getDescription()}">Desc</dd>
                        <dt class="col-5">Started</dt>
                        <dd class="col-7" th:text="${#temporals.format(run.getStartTime(), 'MMM d, h:mm a')}">Jan 1</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    // Sync textarea value to the hidden save form input before save submit
    document.getElementById('saveForm').addEventListener('submit', function() {
        document.getElementById('saveWorkLog').value =
            document.querySelector('#submitForm textarea[name="workLog"]').value;
    });
</script>
</body>
</html>
