<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Password Reset Requests')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4>Password Reset Requests</h4>
            <div class="sub">Confirm who's asking, set a new password, then share it with them directly.</div>
        </div>
        <span class="pill" th:classappend="${!pendingRequests.isEmpty()} ? 'warn'" th:text="${pendingRequests.size() + ' pending'}">0 pending</span>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2" th:text="${param.error}"></div>
    <div th:if="${param.success}" class="alert alert-success py-2" th:text="${param.success}"></div>

    <div class="s2s-panel">
        <div th:if="${#lists.isEmpty(pendingRequests)}" class="s2s-empty">
            <i class="bi bi-key d-block fs-3 mb-1"></i>No pending password reset requests.
        </div>
        <div th:each="request : ${pendingRequests}" class="s2s-row flex-wrap request-row">
            <span class="avatar" th:text="${(request.getFirstName().substring(0,1) + request.getLastName().substring(0,1)).toUpperCase()}">JD</span>
            <span class="grow">
                <span class="title d-block" th:text="${request.getFirstName() + ' ' + request.getLastName()}">John Doe</span>
                <span class="meta d-block" th:text="${request.getEmail() + ' · requested ' + @fmt.ago(request.getCreatedAt())}">john@example.com</span>
            </span>
            <div class="request-actions">
                <form th:action="@{/developer/password-reset-requests/{id}/approve(id=${request.getId()})}" method="post" class="d-flex gap-2 m-0">
                    <input type="password" class="form-control form-control-sm" name="newPassword"
                           placeholder="New password" required autocomplete="new-password" aria-label="New password">
                    <button type="submit" class="btn btn-sm btn-s2s text-nowrap"><i class="bi bi-check-lg me-1"></i>Set password</button>
                </form>
                <form th:action="@{/developer/password-reset-requests/{id}/deny(id=${request.getId()})}" method="post" class="m-0"
                      onsubmit="return confirm('Deny this password reset request?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-x-lg me-1"></i>Deny</button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
