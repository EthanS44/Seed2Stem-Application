<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Report Issue')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="row">
        <div class="col-lg-7">
            <h4 class="mb-2">Report an Issue</h4>
            <p class="text-muted mb-4">
                Found a bug or have a suggestion? Let the developers know. Be as specific
                as you can about what you were doing when the issue happened.
            </p>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/tickets}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">Title</label>
                            <input type="text" class="form-control" id="title" name="title"
                                   placeholder="Short summary of the issue" required maxlength="255">
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="8"
                                      placeholder="What happened? What did you expect to happen? What page were you on?"
                                      required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-s2s">
                                <i class="bi bi-send me-1"></i> Submit Ticket
                            </button>
                            <a th:href="@{/dashboard/home-dashboard}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
