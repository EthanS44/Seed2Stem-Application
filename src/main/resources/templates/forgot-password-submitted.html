<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Request Submitted')}"></head>
<body class="auth-wrapper">

<div class="auth-card">
    <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
            <img th:src="@{/Seed2Stem_Logo.png}" alt="Seed2Stem" class="img-fluid mb-3">
            <h4 class="mb-3">Request Submitted</h4>

            <div class="alert alert-info py-3">
                <i class="bi bi-hourglass-split me-2"></i>
                Your password reset request has been submitted.
                A developer will review your request and provide you with a new password.
            </div>

            <a th:href="@{/auth/login}" class="btn btn-s2s w-100 mt-2">Back to Login</a>
            <div class="text-muted small mt-3">&copy; Seed2Stem</div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
