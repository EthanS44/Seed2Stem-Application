<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Calendar')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4>Calendar</h4>
            <div class="sub">Task runs by day. Tap a day to see it hour by hour.</div>
        </div>
    </div>

    <div class="calendar-legend">
        <span class="calendar-legend-item" data-event-type="checklist-run">
            <span class="calendar-legend-dot" style="background:#0277bd"></span> Checklist Run
        </span>
    </div>

    <div id="calendar"></div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var hiddenTypes = {};
    var calendarEl = document.getElementById('calendar');
    // Phones get a week list and a two-row toolbar; the month grid is too cramped there.
    var narrow = window.matchMedia('(max-width: 575.98px)').matches;
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: narrow ? 'listWeek' : 'dayGridMonth',
        headerToolbar: narrow
            ? { left: 'prev,next', center: 'title', right: 'today' }
            : { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridDay,listWeek' },
        footerToolbar: narrow ? { center: 'dayGridMonth,listWeek' } : false,
        dateClick: function (info) {
            calendar.changeView('timeGridDay', info.dateStr);
        },
        events: function (fetchInfo, successCallback, failureCallback) {
            fetch('/api/calendar/events?start=' +
                  fetchInfo.startStr + '&end=' + fetchInfo.endStr)
                .then(function (resp) {
                    if (!resp.ok) throw new Error('Unauthorized');
                    return resp.json();
                })
                .then(function (data) {
                    var filtered = data.filter(function (e) {
                        return !hiddenTypes[e.eventType];
                    });
                    successCallback(filtered);
                })
                .catch(failureCallback);
        },
        eventClick: function (info) {
            info.jsEvent.preventDefault();
            if (info.event.url) {
                window.location.href = info.event.url;
            }
        },
        height: 'auto'
    });
    calendar.render();

    document.querySelectorAll('.calendar-legend-item').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var type = this.dataset.eventType;
            this.classList.toggle('legend-disabled');
            hiddenTypes[type] = !hiddenTypes[type];
            calendar.refetchEvents();
        });
    });
});
</script>

</body>
</html>
