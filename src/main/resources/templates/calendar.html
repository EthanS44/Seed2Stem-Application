<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Calendar')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4>Calendar</h4>
            <div class="sub" th:text="${isStaff} ? 'Task runs across the team, coloured by status.' : 'Your task runs, coloured by status.'">Task runs.</div>
        </div>
        <div th:if="${isStaff}" class="cal-person">
            <label for="personFilter" class="visually-hidden">Show tasks for</label>
            <select id="personFilter" class="form-select form-select-sm">
                <option value="">Everyone</option>
                <option th:each="p : ${people}" th:value="${p.id}" th:text="${p.getName()}">Name</option>
            </select>
        </div>
    </div>

    <!-- Status filters: tap to hide or show a status -->
    <div class="cal-filters mb-3" role="group" aria-label="Filter by status">
        <button type="button" class="cal-filter" data-status="APPROVED" aria-pressed="true">
            <span class="cal-dot" style="background:#2e7d32"></span>Approved <span class="cal-count" data-count="APPROVED">0</span>
        </button>
        <button type="button" class="cal-filter" data-status="PENDING" aria-pressed="true">
            <span class="cal-dot" style="background:#d98a00"></span>Awaiting approval <span class="cal-count" data-count="PENDING">0</span>
        </button>
        <button type="button" class="cal-filter" data-status="REJECTED" aria-pressed="true">
            <span class="cal-dot" style="background:#c62828"></span>Rejected <span class="cal-count" data-count="REJECTED">0</span>
        </button>
        <button type="button" class="cal-filter" data-status="IN_PROGRESS" aria-pressed="true">
            <span class="cal-dot" style="background:#1565c0"></span>In progress <span class="cal-count" data-count="IN_PROGRESS">0</span>
        </button>
    </div>

    <div class="cal-wrap">
        <div class="cal-loading" id="calLoading" hidden>
            <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>Loading…
        </div>
        <div id="calendar"></div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function () {
    const IS_STAFF = /*[[${isStaff}]]*/ false;
    const narrow = window.matchMedia('(max-width: 575.98px)').matches;
    const hidden = new Set();
    const personSelect = document.getElementById('personFilter');
    const loadingEl = document.getElementById('calLoading');

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: narrow ? 'listWeek' : 'dayGridMonth',
        headerToolbar: narrow
            ? { left: 'prev,next', center: 'title', right: 'today' }
            : { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,listWeek' },
        footerToolbar: narrow ? { center: 'dayGridMonth,listWeek' } : false,
        buttonText: { today: 'Today', month: 'Month', week: 'Week', day: 'Day', list: 'List' },
        height: 'auto',
        views: {
            dayGridMonth: { eventTimeFormat: { hour: 'numeric', minute: '2-digit', meridiem: 'narrow' } },
            timeGridWeek: { height: 680 },
            timeGridDay: { height: 680 }
        },
        dayMaxEvents: narrow ? false : 3,
        allDaySlot: false,
        eventMinHeight: 36,
        nowIndicator: true,
        scrollTime: '07:00:00',
        slotMinTime: '05:00:00',
        eventTimeFormat: { hour: 'numeric', minute: '2-digit', meridiem: 'short' },
        noEventsContent: 'No tasks in this period.',

        events: function (info, success, failure) {
            const params = new URLSearchParams({ start: info.startStr, end: info.endStr });
            if (personSelect && personSelect.value) params.set('userId', personSelect.value);
            fetch('/api/calendar/events?' + params)
                .then(r => { if (!r.ok) throw new Error('Could not load events'); return r.json(); })
                .then(data => {
                    updateCounts(data);
                    success(data.filter(e => !hidden.has(e.status)));
                })
                .catch(failure);
        },

        loading: function (isLoading) { loadingEl.hidden = !isLoading; },

        // Compact row in month view, fuller card in week/day/list views.
        eventContent: function (arg) {
            const p = arg.event.extendedProps;
            const color = arg.event.backgroundColor;
            const who = IS_STAFF ? p.person : '';
            if (arg.view.type === 'dayGridMonth' && narrow) {
                // Phone month view: just a status dot per task; tap the day for details.
                return { html: '<span class="cal-dot" style="background:' + color + '"></span>' };
            }
            if (arg.view.type === 'dayGridMonth') {
                return { html:
                    '<span class="cal-ev">' +
                    '<span class="cal-dot" style="background:' + color + '"></span>' +
                    '<span class="cal-title">' + esc(arg.event.title) + '</span>' +
                    '<span class="cal-time">' + esc(arg.timeText) + (who ? ' · ' + esc(who.split(' ')[0]) : '') + '</span>' +
                    '</span>' };
            }
            if (arg.view.type.startsWith('list')) {
                return { html:
                    '<span class="fw-semibold">' + esc(arg.event.title) + '</span>' +
                    (who ? '<span class="text-muted"> · ' + esc(who) + '</span>' : '') +
                    ' <span class="cal-status" style="--c:' + color + '">' + esc(p.statusLabel) + '</span>' };
            }
            return { html:
                '<div class="cal-block">' +
                '<div class="cal-block-title">' + esc(arg.event.title) + '</div>' +
                '<div class="cal-block-meta">' + esc(arg.timeText) + (who ? ' · ' + esc(who) : '') + '</div>' +
                '</div>' };
        },

        eventDidMount: function (info) {
            const p = info.event.extendedProps;
            const time = info.event.start ? info.event.start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
            info.el.title = info.event.title + (p.person ? ' — ' + p.person : '') + '\n' + p.statusLabel + (time ? ' · ' + time : '');
        },

        eventClick: function (info) {
            info.jsEvent.preventDefault();
            if (narrow && info.view.type === 'dayGridMonth') {
                calendar.changeView('listDay', info.event.start);
                return;
            }
            if (info.event.url) window.location.href = info.event.url;
        },

        dateClick: function (info) {
            if (info.view.type === 'dayGridMonth') calendar.changeView(narrow ? 'listDay' : 'timeGridDay', info.dateStr);
        }
    });
    if (narrow) document.getElementById('calendar').classList.add('cal-narrow');
    calendar.render();

    // The page scrollbar appears once events load and narrows the container;
    // FullCalendar only re-measures on window resize, so watch the container itself.
    new ResizeObserver(() => calendar.updateSize()).observe(document.querySelector('.cal-wrap'));

    function updateCounts(data) {
        const counts = { APPROVED: 0, PENDING: 0, REJECTED: 0, IN_PROGRESS: 0 };
        data.forEach(e => { if (e.status in counts) counts[e.status]++; });
        document.querySelectorAll('[data-count]').forEach(el => { el.textContent = counts[el.dataset.count]; });
    }

    document.querySelectorAll('.cal-filter').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const status = btn.dataset.status;
            if (hidden.has(status)) hidden.delete(status); else hidden.add(status);
            btn.setAttribute('aria-pressed', String(!hidden.has(status)));
            calendar.refetchEvents();
        });
    });
    if (personSelect) personSelect.addEventListener('change', () => calendar.refetchEvents());
});
</script>
</body>
</html>
