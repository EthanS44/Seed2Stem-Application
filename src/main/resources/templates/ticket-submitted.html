<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Ticket Submitted')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="row">
        <div class="col-lg-7">
            <div class="card shadow-sm border-success">
                <div class="card-body text-center py-5">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                    <h4 class="mt-3 mb-2">Thanks — your ticket was submitted</h4>
                    <p class="text-muted mb-4">
                        A developer will see your report. You won't get a notification when
                        it's looked at — if the issue is still happening after a while, feel
                        free to submit another ticket.
                    </p>
                    <div class="d-flex gap-2 justify-content-center">
                        <a th:href="@{/tickets/new}" class="btn btn-outline-s2s">
                            <i class="bi bi-plus-circle me-1"></i> Submit Another
                        </a>
                        <a th:href="@{/dashboard/home-dashboard}" class="btn btn-s2s">
                            <i class="bi bi-house-door me-1"></i> Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
