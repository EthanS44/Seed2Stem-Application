<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Seed2Stem - Time Clock')}"></head>
<body>

<nav th:replace="~{fragments/layout :: topbar}"></nav>
<nav th:replace="~{fragments/layout :: sidebar}"></nav>

<main class="s2s-content">
    <div class="page-head">
        <div>
            <h4>Time Clock</h4>
            <div class="sub" th:text="${#temporals.format(#temporals.createToday(), 'EEEE, MMMM d')}">Monday, October 19</div>
        </div>
        <a th:href="@{/time-clock/history}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-clock-history me-1"></i>Full history</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-3">
        <!-- Clock in / out -->
        <div class="col-lg-5">
            <div class="s2s-card text-center py-4 mb-3 clock-card" th:classappend="${isClockedIn} ? 'on'">
                <div th:if="${!isClockedIn}">
                    <span class="clock-icon"><i class="bi bi-clock"></i></span>
                    <h5 class="mt-3 mb-1">You're not clocked in</h5>
                    <p class="text-muted small mb-3">Clock in when you start your shift.</p>
                    <form method="post" th:action="@{/time-clock/clock-in}">
                        <button type="submit" class="btn btn-s2s btn-lg px-5 clock-btn">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Clock In
                        </button>
                    </form>
                </div>

                <div th:if="${isClockedIn}">
                    <span class="pill ok"><i class="bi bi-circle-fill" style="font-size:.5rem"></i>On the clock</span>
                    <div id="elapsed-time" class="clock-timer" th:attr="data-clock-in-time=${activeEntry.clockInTime}">--:--:--</div>
                    <p class="text-muted small mb-3" th:text="${'Since ' + @fmt.when(activeEntry.clockInTime)}">Since 9:00 AM</p>
                    <form method="post" th:action="@{/time-clock/clock-out}" class="text-start mx-auto" style="max-width: 360px;">
                        <label for="clockOutNotes" class="form-label small fw-semibold">Notes <span class="text-muted fw-normal">(optional)</span></label>
                        <textarea id="clockOutNotes" name="notes" class="form-control mb-3" rows="2" placeholder="Anything to note about this shift"></textarea>
                        <button type="submit" class="btn btn-outline-danger btn-lg w-100">
                            <i class="bi bi-box-arrow-right me-2"></i>Clock Out
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <!-- Today -->
            <div class="s2s-panel mb-3">
                <div class="panel-head"><h6><i class="bi bi-calendar-day me-2"></i>Today</h6></div>
                <div th:if="${#lists.isEmpty(todayEntries)}" class="s2s-empty">No time logged today.</div>
                <div th:each="entry : ${todayEntries}" class="s2s-row">
                    <span class="grow">
                        <span class="title d-block">
                            <span th:text="${#temporals.format(entry.clockInTime, 'h:mm a')}">9:00 AM</span> –
                            <span th:if="${entry.clockOutTime != null}" th:text="${#temporals.format(entry.clockOutTime, 'h:mm a')}">5:00 PM</span>
                            <span th:if="${entry.clockOutTime == null}">now</span>
                        </span>
                        <span class="meta d-block" th:if="${entry.notes != null and !entry.notes.isBlank()}" th:text="${entry.notes}">Notes</span>
                    </span>
                    <span th:if="${entry.clockOutTime == null}" class="pill ok">Active</span>
                    <span th:if="${entry.totalHours != null}" class="fw-semibold" th:text="${entry.totalHours + ' h'}">8.0 h</span>
                </div>
            </div>

            <!-- Last 7 days -->
            <div class="s2s-panel mb-3">
                <div class="panel-head">
                    <h6><i class="bi bi-clock-history me-2"></i>Last 7 days</h6>
                    <a th:href="@{/time-clock/history}">View all</a>
                </div>
                <div th:if="${#lists.isEmpty(recentEntries)}" class="s2s-empty">No recent shifts.</div>
                <div th:each="entry : ${recentEntries}" class="s2s-row">
                    <span class="grow">
                        <span class="title d-block" th:text="${#temporals.format(entry.date, 'EEE, MMM d')}">Mon, Mar 25</span>
                        <span class="meta d-block">
                            <span th:text="${#temporals.format(entry.clockInTime, 'h:mm a')}">9:00 AM</span> –
                            <span th:text="${entry.clockOutTime != null ? #temporals.format(entry.clockOutTime, 'h:mm a') : 'now'}">5:00 PM</span>
                        </span>
                    </span>
                    <span th:if="${entry.clockOutTime == null}" class="pill ok">Active</span>
                    <span th:if="${entry.totalHours != null}" class="fw-semibold" th:text="${entry.totalHours + ' h'}">8.0 h</span>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>

<script th:if="${isClockedIn}">
    (function() {
        const el = document.getElementById('elapsed-time');
        const clockIn = new Date(el.getAttribute('data-clock-in-time'));
        function update() {
            const now = new Date();
            const diff = Math.floor((now - clockIn) / 1000);
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            const s = diff % 60;
            el.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }
        update();
        setInterval(update, 1000);
    })();
</script>
</body>
</html>
