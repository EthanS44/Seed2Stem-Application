spring.application.name=Seed2Stem

server.port=${PORT}
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Honour X-Forwarded-Proto from Railway's HTTPS-terminating proxy so Spring
# generates correct https:// URLs in redirects (otherwise cookies can be
# dropped when the response Location is http:// and the browser hops back
# to https://, which broke the Excel export download).
server.forward-headers-strategy=native

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/New_York

# SOP PDF upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB